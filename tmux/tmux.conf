# color y estilo
set -g default-terminal "screen-256color"
set -g mouse on
setw -g mode-keys vi

# split panes
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# mover entre paneles con alt + flechas
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# status bar minimalista
set -g status-bg colour235
set -g status-fg colour136
set -g status-left ''
set -g status-right '#(whoami) | %Y-%m-%d %H:%M'

# Claude Code en un popup por directorio. install.sh clona el plugin.
run-shell ~/.tmux/plugins/tmux-claude-hatch/claude_hatch.tmux

# roster: live agents. Ctrl-b g opens the list. Esc does not kill the session.
bind-key g run-shell "$HOME/.local/bin/roster popup #{q:client_name}"
